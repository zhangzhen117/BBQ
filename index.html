<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUNCH Group BBQ</title>
  <meta name="description" content="Summer BBQs of the CRUNCH group at Brown University: upcoming dates, locations, and photos from past cookouts.">
  <meta property="og:title" content="CRUNCH Group BBQ">
  <meta property="og:description" content="When and where is the next BBQ, plus photos from past ones.">
  <meta property="og:image" content="assets/img/hero.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="hero" style="background-image: url('assets/img/hero.jpg')">
    <nav class="nav">
      <a class="brand" href="#top">🔥 CRUNCH BBQ</a>
      <div class="nav-links">
        <a href="#next">Next BBQ</a>
        <a href="#past">Past BBQs</a>
      </div>
    </nav>
    <div class="hero-content" id="top">
      <p class="eyebrow">CRUNCH Group · Brown University</p>
      <h1>Summer BBQ</h1>
      <p class="tagline">Good food, good people, and the occasional over-charred burger.</p>
      <a class="btn btn-primary" href="#next">See the next BBQ</a>
    </div>
    <div class="hero-fade"></div>
  </header>

  <main>
    <section class="section" id="next">
      <h2 class="section-title"><span>Next BBQ</span></h2>
      <div id="next-event" class="next-card"></div>
    </section>

    <section class="section" id="past">
      <h2 class="section-title"><span>Past BBQs</span></h2>
      <div id="past-events"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Made with 🔥 by the CRUNCH group. Photos belong to their respective takers.</p>
    <p><a href="https://github.com/zhangzhen117/BBQ">Source on GitHub</a></p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">&#10094;</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next">&#10095;</button>
  </div>

  <script src="events.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
